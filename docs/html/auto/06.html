<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css?v=20261020235316"><link rel="stylesheet" href="../templates.css?v=20261020235316"><link rel="stylesheet" href="../diagram.css?v=20261020235316"><script src="../base.js?v=20261020235316"></script></head><body><div class="slide"><div class="grid"></div><div class="tagpos"><span class="tag">Act I · The inversion</span></div><h2 class="st-head" data-edit="headline" style="font-size:104px">If it was not on the open, linkable web, the model <em>did not learn it.</em></h2><div class="st-sub" data-edit="sub" style="top:640px">Links, HTML and indexable pages made the first wave possible. Content inside closed apps stayed invisible to the crawlers.</div><div class="src" data-edit="source">Common Crawl covers public pages, not pages behind logins.</div></div></body></html>
